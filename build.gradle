// The Module build, every piece of it from the libworks convention plugin (libworks ADR 0003):
// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing, and the release, upload and buildGametestStructures tasks.
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.4.4'
}

// A Touch Of's Runtime, which draws the Vesper Dial's meter (suite ADR-0005), and which a Pillar nests.
def atouchofRange = '[0.1.2,0.2)'

// What the Module requires of other Modules, each as a range (libworks ADR 0003):
libworks {
    // A Pillar nests no libworks-runtime (suite ADR-0002), so its game tests run without libworks-gametest.
    upstream('atouchof') { range = atouchofRange }
}


repositories {
    // EMI for 26.1 is an unofficial port, published on CurseForge only.
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Jade.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Tough As Nails and GlitchCore, its library.
    maven {
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'com.github.glitchfiend' }
    }
}

// Mods the dev client loads alongside the Pillar, to read a placed light's fuel (Jade), look up
// recipes and information pages (EMI) and feel a Campfire's heat (Tough As Nails) while trying it by
// hand. 26.1 has no per-run classpath, so they go into the client's mods folder, which holds only what
// is listed here; the game tests run from run/gametest and never load them, so they still prove the
// Pillar plays alone in vanilla.
configurations {
    clientMods { transitive = false }
}

def syncClientMods = tasks.register('syncClientMods', Sync) {
    from configurations.clientMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('runClient') { dependsOn syncClientMods }

dependencies {
    jarJar('io.github.5thlayer:atouchof') {
        version {
            strictly atouchofRange
            prefer '0.1.2'
        }
    }
    // Jade for 26.1.2 is built on NeoForge 26.1.2.76, so it runs on our .77. Jade finds the Pillar's
    // plugin by its annotation, and EMI by its entrypoint, so the Pillar runs without either (#20).
    compileOnly 'maven.modrinth:jade:26.1.11+neoforge'
    clientMods 'maven.modrinth:jade:26.1.11+neoforge'
    // EMI for 26.1 is the unofficial port.
    compileOnly 'curse.maven:emi-unofficial-port-1544558:8630349'
    clientMods 'curse.maven:emi-unofficial-port-1544558:8630349'
    // Tough As Nails, a beta for 26.1.2, reads the Campfires from the tags the Pillar ships for it, so
    // the Pillar compiles against none of it (#13). GlitchCore is its library.
    clientMods 'com.github.glitchfiend:ToughAsNails-neoforge:26.1.2-21.11.0.6'
    clientMods 'com.github.glitchfiend:GlitchCore-neoforge:26.1.2-26.1.2.0.2'
}

neoForge {
    runs {
        // EMI's 26.1 port still carries @OnlyIn, and the dev client halts on a warning screen over it
        // that production never shows. Only the client loads EMI.
        client {
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
    }
}
