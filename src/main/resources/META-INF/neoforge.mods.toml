modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "LGPL-3.0-only"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Module's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''
# Adds the Strike's difficulty scaling and death messages to vanilla's DamageScaling and DeathMessageType.
enumExtensions = "META-INF/enumextensions.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# A Touch Of's Runtime, nested in the jar, which draws the Vesper Dial's meter (#32).
[[dependencies.${mod_id}]]
modId = "atouchof"
type = "required"
versionRange = "${atouchof_range}"
ordering = "AFTER"
side = "BOTH"

# Shows a placed Campfire's and Lamp's fuel in Jade's tooltip (#20). Not required: its plugin is only
# loaded by Jade. The range is the Jade the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[26.1.11,)"
ordering = "NONE"
side = "BOTH"

# Shows information pages on the Pillar's lights in EMI (#20). Not required: its plugin is only
# loaded by EMI. The range is the EMI port the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1.24,)"
ordering = "NONE"
side = "CLIENT"

# A lit Campfire warms and a lit Soul Campfire cools where Tough As Nails is loaded, by the entries the
# Pillar adds to its heating_blocks and cooling_blocks tags (#13). Not required: no code calls it, and
# the tags name only the Pillar's blocks, so any version reads them.
[[dependencies.${mod_id}]]
modId = "toughasnails"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

# Puts out the Unlit blocks' light and empties their tag while vanilla's light is back (ADR 0003).
[[mixins]]
config = "${mod_id}.mixins.json"
